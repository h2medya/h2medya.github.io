<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hüseyin Eken | H2 Medya</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600&display=swap">
<style>
:root{
  --page:#e4e4e4; --white:#ffffff; --ink:#201f20; --orange:#d8401a; --dark:#201f20; --mark:#3b3839; --text:#ffffff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#111010;color-scheme:dark}}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--page);font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;display:flex;justify-content:center;align-items:flex-start}
.card{width:100%;max-width:460px;margin:20px 14px;border-radius:28px;overflow:hidden;background:var(--dark);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.top{background:var(--white);padding:38px 30px 24px}
.top h1{margin:0;font-weight:300;font-size:44px;line-height:1.05;letter-spacing:.01em;color:var(--ink)}
.top p{margin:10px 0 0;font-size:17px;font-weight:500;color:var(--orange)}
.band{height:26px;background:var(--orange)}
.bottom{position:relative;padding:34px 26px 190px;background:var(--dark);overflow:hidden}
.rows{position:relative;z-index:1}
.row{display:flex;gap:18px;align-items:center;padding:16px 0;color:var(--text);text-decoration:none;font-size:20px;font-weight:500;line-height:1.3}
.row:focus-visible,.save:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
.row svg{flex:none;width:30px;height:30px;fill:none;stroke:var(--orange);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row small{display:block;font-size:15px;font-weight:400;opacity:.65}
.save{position:relative;z-index:1;display:block;margin-top:22px;padding:15px;text-align:center;background:var(--orange);color:#fff;border-radius:12px;font-size:21px;font-weight:600;text-decoration:none}
.mark{position:absolute;left:22px;bottom:-26px;display:flex;align-items:flex-end;pointer-events:none}
.mark b{font-weight:600;font-size:230px;line-height:.8;color:var(--mark);letter-spacing:-.02em}
.film{width:28px;height:128px;margin-right:6px;margin-bottom:34px;background:
  repeating-linear-gradient(to bottom,transparent 0 6px,#59565a 6px 12px) 3px 0/5px 100% no-repeat,
  repeating-linear-gradient(to bottom,transparent 0 6px,#59565a 6px 12px) calc(100% - 3px) 0/5px 100% no-repeat,
  #3b3839;border-radius:2px}
.logo{background:#ececec;padding:34px 38px}
.logo img{display:block;width:100%;height:auto}
</style>
</head>
<body>
<main class="card">
  <header class="top">
    <h1>HÜSEYİN EKEN</h1>
    <p>Yapımcı / Yönetmen</p>
  </header>
  <div class="band"></div>
  <section class="bottom">
    <div class="rows">
      <a class="row" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=Esentepe+Mah.+B%C3%BCy%C3%BCkdere+Cad.+LOFT+Residence+%C5%9Ei%C5%9Fli+%C4%B0stanbul">
        <svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5a7 7 0 0 0-14 0C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <span>Esentepe Mah. Büyükdere Cad.<br>LOFT Residence A Blok No: 201 / 40<br>Şişli / İstanbul<small>Haritada aç</small></span>
      </a>
      <a class="row" href="mailto:h2medyayapim@gmail.com">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <span>h2medyayapim@gmail.com</span>
      </a>
      <a class="row" href="tel:+905327180903">
        <svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg>
        <span>0532 718 09 03</span>
      </a>
    </div>
    <a class="save" href="huseyin.vcf" download>Rehbere kaydet</a>
    <div class="mark" aria-hidden="true"><div class="film"></div><b>H2</b></div>
  </section>
  <div class="logo"><img src="logo.png" width="900" height="310" alt="H2 Medya İletişim &amp; Prodüksiyon"></div>
</main>
</body>
</html>
